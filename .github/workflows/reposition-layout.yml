name: Reposición · pantallas
on:
  pull_request:
    paths:
      - 'operaciones/**'
      - 'tools/reposition-layout.py'
      - '.github/workflows/reposition-layout.yml'
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 tools/reposition-layout.py
