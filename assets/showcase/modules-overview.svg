<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Selector de módulos de Labama</title>
  <desc id="desc">Vista representativa de Inventario, Reposición, Control de remitos y Pedidos entre locales.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101017"/><stop offset="1" stop-color="#171720"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".24"/></filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="54" y="72" fill="#e8e8f0" font-family="Arial,sans-serif" font-size="35" font-weight="700">Escoja un módulo para realizar su tarea:</text>
  <text x="54" y="106" fill="#9090a8" font-family="Arial,sans-serif" font-size="15">Todos los módulos comparten usuarios, locales y el padrón de productos.</text>
  <g filter="url(#shadow)">
    <g transform="translate(54 150)">
      <rect width="530" height="205" rx="20" fill="#1b1b24" stroke="#6c63ff"/>
      <rect x="28" y="28" width="64" height="64" rx="18" fill="#292742"/>
      <path d="M49 61l10 10 20-31" fill="none" stroke="#7770ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="116" y="59" fill="#ececf4" font-family="Arial,sans-serif" font-size="25" font-weight="700">Inventario</text>
      <text x="116" y="88" fill="#9b9bb1" font-family="Arial,sans-serif" font-size="15">Conteo colaborativo, escáner y diferencias.</text>
      <text x="116" y="164" fill="#7770ff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Entrar a Inventario →</text>
    </g>
    <g transform="translate(616 150)">
      <rect width="530" height="205" rx="20" fill="#1b1b24" stroke="#30303f"/>
      <rect x="28" y="28" width="64" height="64" rx="18" fill="#3a2d20"/>
      <text x="47" y="70" fill="#f6a312" font-family="Arial,sans-serif" font-size="31">⇄</text>
      <text x="116" y="59" fill="#ececf4" font-family="Arial,sans-serif" font-size="25" font-weight="700">Reposición</text>
      <text x="116" y="88" fill="#9b9bb1" font-family="Arial,sans-serif" font-size="15">Preparación, pedidos y remitos.</text>
      <text x="116" y="164" fill="#7770ff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Entrar a Reposición →</text>
    </g>
    <g transform="translate(54 382)">
      <rect width="530" height="205" rx="20" fill="#1b1b24" stroke="#30303f"/>
      <rect x="28" y="28" width="64" height="64" rx="18" fill="#173145"/>
      <circle cx="60" cy="59" r="13" fill="none" stroke="#38bdf8" stroke-width="3"/><path d="M50 72l-9 10" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <text x="116" y="59" fill="#ececf4" font-family="Arial,sans-serif" font-size="25" font-weight="700">Control de remitos</text>
      <text x="116" y="88" fill="#9b9bb1" font-family="Arial,sans-serif" font-size="15">Verificación de lo recibido en cada local.</text>
      <text x="116" y="164" fill="#7770ff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Entrar a Recepción →</text>
    </g>
    <g transform="translate(616 382)">
      <rect width="530" height="205" rx="20" fill="#1b1b24" stroke="#30303f"/>
      <rect x="28" y="28" width="64" height="64" rx="18" fill="#173b30"/>
      <path d="M46 51l14-8 14 8-14 8zM46 52v17l14 9V59zm28 0v17l-14 9V59z" fill="#d9a06f"/>
      <text x="116" y="59" fill="#ececf4" font-family="Arial,sans-serif" font-size="25" font-weight="700">Pedidos entre locales</text>
      <text x="116" y="88" fill="#9b9bb1" font-family="Arial,sans-serif" font-size="15">Solicitudes, aceptación y seguimiento.</text>
      <text x="116" y="164" fill="#7770ff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Entrar a Pedidos →</text>
    </g>
  </g>
</svg>
